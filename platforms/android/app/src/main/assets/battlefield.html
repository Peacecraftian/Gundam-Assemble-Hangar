<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
@font-face{font-family:Chakra;src:url('ChakraPetch-Bold.ttf')}
*{box-sizing:border-box}body{margin:0;background:#151a1c;color:#f2ede0;font:16px system-ui,sans-serif}
main{display:grid;grid-template-columns:minmax(185px,1fr) minmax(0,1.9fr) minmax(185px,1fr);gap:10px;padding:8px;height:100vh}
section,aside,figure{margin:0;background:#222a2c;border:1px solid #495554;border-radius:5px}
section,aside{padding:12px;overflow:auto}h1,h2,figcaption{font-family:Chakra,sans-serif;margin:0}
h1{font-size:21px}h2{color:#ffb762;font-size:15px;margin:14px 0 4px}p{margin:0;white-space:pre-wrap;line-height:1.38}
figure{display:flex;flex-direction:column;min-height:0;padding:6px 2px;align-items:center;background:#192022}
figcaption{font-size:14px;text-align:center}#board{flex:1;min-height:0;width:100%}#north{color:#ff9b88}#south{color:#77d6c1}
.key{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:14px}.key img,.swatch{width:25px;height:25px;object-fit:contain}
.swatch{clip-path:polygon(25% 7%,75% 7%,100% 50%,75% 93%,25% 93%,0 50%)}
#empty{margin:20px}#empty:empty{display:none}[hidden]{display:none}
@media(max-width:790px){main{height:auto;grid-template-columns:1fr 1fr}figure{grid-column:1/-1;grid-row:1;height:78vh}section,aside{overflow:visible}}
#board{touch-action:none}#board g:not(#ground):is(#stars,#decals,#grid,#tokens){pointer-events:none}
button,select,input,textarea{background:#303b3d;color:#f2ede0;border:1px solid #667678;border-radius:5px;padding:7px;font:inherit}
button,select{min-height:44px}aside button.key{width:100%;text-align:left}button[aria-pressed=true]{border-color:#ffb762;color:#ffb762}
textarea,input{width:100%;margin:4px 0}textarea{min-height:85px}#grid .highlight polygon{stroke:#ffe3aa;stroke-width:2.8}
.placed,.puff{transform-box:fill-box;transform-origin:center}.placed{animation:place .26s ease-out}
.puff{fill:none;stroke:#fff1cf;stroke-width:1.5;opacity:0;animation:puff .32s ease-out}
@keyframes place{0%{transform:scale(.65)}65%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes puff{0%{opacity:.75;transform:scale(.65)}100%{opacity:0;transform:scale(1.45)}}
@media(prefers-reduced-motion:reduce){.placed,.puff{animation:none}}
#mapControls{display:flex;gap:8px}summary{cursor:pointer;padding:12px;background:#303b3d;border:1px solid #667678;border-radius:5px;font-weight:bold}details button{width:100%;text-align:left}
#hud{font-size:14px;white-space:pre-line}#hud:empty{display:none}
.key,figcaption,button,summary{font-family:Chakra,sans-serif}section,aside,figure{box-shadow:inset 0 1px #63706c,0 2px 3px #080b0c77}button,summary{background:linear-gradient(#425053,#303a3c);border-color:#6a7672;box-shadow:0 1px 2px #101516}button:focus-visible,summary:focus-visible{outline:2px solid #d1edff}button:active{background:#242b2d}.legend-id{order:-1;font:11px monospace;color:#b4bcb5;border:1px solid #57635f;border-radius:2px;padding:2px}
#tokens image{filter:drop-shadow(0 1px 1px #111a)}figcaption{padding:4px 0}figcaption:before{content:'';display:inline-block;width:16px;height:16px;margin:0 6px -3px 0;background:currentColor;mask:url('map-art/objective.svg') center/contain no-repeat}
</style>
<div id="empty"></div>
<main hidden><section aria-label="Mission briefing"><h1>Mission briefing</h1><div id="brief"></div></section>
<figure><figcaption id="north"></figcaption><svg xmlns="http://www.w3.org/2000/svg" id="board" role="img"></svg><figcaption id="south"></figcaption><div id="mapControls"></div></figure>
<aside aria-label="Map legend"><h1>Legend</h1><p id="hud" aria-live="polite"></p><div id="keys"></div></aside></main>
<script src="battlefield.js"></script></html>
