name: Validate cards and prepare runtime assets
on:
  push:
  pull_request:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - run: python -m pip install -r requirements.txt
      - run: npm ci --prefix tools
      - run: npm exec --prefix tools -- playwright install --with-deps chromium
      - name: Select installed Chromium
        run: node -e "require('node:fs').appendFileSync(process.env.GITHUB_ENV, 'CARD_RENDER_CHROME=' + require('./tools/node_modules/playwright').chromium.executablePath() + '\n')"
      - run: python -m unittest discover -s tests -v
      - run: python -m tools.prepare_assets
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-assets
          path: .build/published
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: card-onboarding-report
          path: .build/onboarding.json
          if-no-files-found: ignore
          retention-days: 7
